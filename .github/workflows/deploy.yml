name: Deploy Pairly to GitHub Pages

on:
  push:
    branches: ["main", "master", "claude/couple-budget-pwa-pWrD7"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./budget-pwa
          publish_branch: gh-pages
          force_orphan: true
