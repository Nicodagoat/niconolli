name: Trenord Strike Monitor

on:
  schedule:
    # Ogni 6 ore (UTC). Nota: gli schedule GitHub possono slittare di qualche minuto.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trenord-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trenord-strike-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trenord-strike-monitor/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # Lo storico SQLite viene conservato tra le run tramite la cache di
      # GitHub Actions: si ripristina l'ultima versione disponibile e a fine
      # run se ne salva una nuova (le chiavi di cache sono immutabili).
      - name: Restore state database
        uses: actions/cache/restore@v4
        with:
          path: trenord-strike-monitor/data
          key: trenord-monitor-state-${{ github.run_id }}
          restore-keys: |
            trenord-monitor-state-

      - name: Write Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets data/ics logs
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > secrets/service_account.json
          else
            echo "::warning::Secret GOOGLE_SERVICE_ACCOUNT_JSON assente: gli eventi Google Calendar non verranno creati"
          fi

      - name: Run check
        env:
          GOOGLE_AUTH_METHOD: service_account
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/service_account.json
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once

      - name: Save state database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trenord-strike-monitor/data
          key: trenord-monitor-state-${{ github.run_id }}

      - name: Upload ICS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ics-files-${{ github.run_id }}
          path: trenord-strike-monitor/data/ics/*.ics
          if-no-files-found: ignore
          retention-days: 30
