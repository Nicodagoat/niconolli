<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed background for maskable icon (safe zone is center 80%) -->
  <rect width="512" height="512" fill="#22223B"/>

  <!-- Two overlapping circles (kept within safe zone ~102px padding) -->
  <circle cx="196" cy="256" r="72" fill="none" stroke="#C9ADA7" stroke-width="12" opacity="0.7"/>
  <circle cx="316" cy="256" r="72" fill="none" stroke="#4A4E69" stroke-width="12" opacity="0.8"/>

  <!-- Euro symbol -->
  <text
    x="256"
    y="272"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="110"
    font-weight="700"
    fill="#F2E9E4"
    text-anchor="middle"
    dominant-baseline="middle"
  >€</text>
</svg>
